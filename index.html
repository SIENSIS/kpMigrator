let current = { code:'', filename:'', path:'' };

function refresh() {
  // class name input (auto)
  const ci = document.getElementById('classInput');
  if (ci && state.settings.autoClass) ci.value = autoClassName();

  let code = '', filename = '', path = '', lang = 'php';
  try {
    if (ui.out === 'migration') {
      code = state.mode === 'create' ? genCreate() : genUpdate();
      filename = `${state.settings.timestamp}_${className()}.php`; path = 'app/Database/Migrations/';
    } else if (ui.out === 'seeder') {
      code = genSeeder(); filename = `${seederClass()}.php`; path = 'app/Database/Seeds/';
    } else {
      code = JSON.stringify(state, null, 2); filename = `kpmigrator-${state.mode === 'create' ? state.create.table : state.update.table}.json`; lang = 'json';
    }
  } catch (e) { code = '// Error generant el codi: ' + e.message; console.error(e); }
  current = { code, filename, path };

  document.querySelectorAll('#outSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === ui.out));
  document.getElementById('fname').textContent = filename;
  document.getElementById('fpath').textContent = path;

  const el = document.getElementById('code');
  let html;
  if (window.hljs && lang === 'php') { try { html = hljs.highlight(code, { language:'php' }).value; } catch { html = esc(code); } }
  else if (window.hljs && lang === 'json' && hljs.getLanguage('json')) html = hljs.highlight(code, { language:'json' }).value;
  else html = esc(code);
  // line numbers (keeps highlight spans intact by splitting on newlines outside tags – hljs never spans a tag across lines for php)
  el.innerHTML = splitLinesHtml(html).map((l, i) => `<span class="ln">${i+1}</span>${l}`).join('\n');

  // issues
  const issues = validate();
  const box = document.getElementById('issues');
  const icon = { err:'alert', warn:'alert', info:'info', ok:'check' };
  const list = issues.length ? issues : [['ok', 'Tot correcte: el codi està llest per copiar a CodeIgniter 4.']];
  box.innerHTML = list.map(([t, m]) => `<div class="issue ${t}">${ic(icon[t],'sm')}<span>${m}</span></div>`).join('');

  // steps
  const st = document.getElementById('steps');
  if (ui.out === 'migration') {
    st.innerHTML = cmd(`Desa el fitxer a ${path}${filename}`, true) + cmd('php spark migrate') + cmd('php spark migrate:rollback') + cmd('php spark migrate:status');
  } else if (ui.out === 'seeder') {
    st.innerHTML = cmd(`Desa el fitxer a ${path}${filename}`, true) + cmd(`php spark db:seed ${seederClass()}`) + `<div class="hint">Per executar-los tots, crida <code>$this->call('${seederClass()}');</code> des de <code>DatabaseSeeder</code>.</div>`;
  } else {
    st.innerHTML = `<div class="hint">Desa aquest JSON per tornar a carregar l'esquema més endavant (botó Importar) o comparteix-lo amb l'equip.</div>`;
  }

  // update tab badges w/o full render
  save();
}

function splitLinesHtml(html) {
  // Close & reopen spans across newlines so each line is self-contained.
  const out = []; let open = []; let line = '';
  const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<)/g; let m;
  while ((m = re.exec(html))) {
    if (m[1]) { open.push(m[1]); line += m[1]; }
    else if (m[2]) { open.pop(); line += m[2]; }
    else if (m[3]) { line += '</span>'.repeat(open.length); out.push(line); line = open.join(''); }
    else line += m[4];
  }
  out.push(line);
  return out;
}

function cmd(text, isComment = false) {
  return `<div class="cmd"><code>${isComment ? `<span class="c"># ${esc(text)}</span>` : esc(text)}</code>${isComment ? '' : `<button class="btn icon ghost" data-action="copy-text" data-text="${esc(text)}" title="Copiar">${ic('copy','sm')}</button>`}</div>`;
}

/* =========================================================================
   RENDER + PERSISTENCE
   ========================================================================= */
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 0); }
function render() {
  const ae = document.activeElement;
  const bind = ae && ae.dataset ? ae.dataset.bind : null;
  let ss = null, se = null; try { ss = ae.selectionStart; se = ae.selectionEnd; } catch {}
  renderEditor();
  refresh();
  if (bind) {
    const el = document.querySelector(`[data-bind="${CSS.escape(bind)}"]`);
    if (el && !el.disabled) { el.focus({ preventScroll:true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch {} }
  }
}

const LS_KEY = 'kpmigrator:v3';
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify({ state, ui })); } catch {} }, 250);
}
function normalize(st) {
  const d = defaultState();
  const s = Object.assign(d, st || {});
  s.settings = Object.assign(defaultState().settings, st?.settings || {});
  s.create = Object.assign(defaultState().create, st?.create || {});
  s.create.fields = (s.create.fields || []).map(f => Object.assign(F(''), f));
  s.create.fks = s.create.fks || []; s.create.indexes = s.create.indexes || [];
  s.update = Object.assign({ table:'', ops:[] }, st?.update || {});
  s.update.ops = (s.update.ops || []).filter(o => OP_META[o.kind]).map(o => {
    const b = Object.assign(newOp(o.kind), o);
    ['field','from','to'].forEach(k => { if (b[k]) b[k] = Object.assign(F(''), b[k]); });
    return b;
  });
  s.seeder = Object.assign(defaultState().seeder, st?.seeder || {});
  s.seeder.gens = s.seeder.gens || {};
  return s;
}
function loadInitial() {
  // 1) shared link  2) localStorage
  const m = location.hash.match(/^#s=([\w\-]+)/);
  if (m) {
    try { const st = JSON.parse(b64dec(m[1])); state = normalize(st); ui.tab = state.mode === 'create' ? 'fields' : 'ops'; history.replaceState(null, '', location.pathname + location.search); toast('Esquema carregat des de l\'enllaç compartit'); return; }
    catch { toast('Enllaç compartit no vàlid', true); }
  }
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); state = normalize(d.state); ui = Object.assign(ui, d.ui || {}); } } catch {}
}
const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)));

/* =========================================================================
   EVENTS
   ========================================================================= */
function readValue(el) {
  if (el.type === 'checkbox') return el.checked;
  if ('num' in el.dataset) return el.value === '' ? '' : Number(el.value);
  return el.value;
}

function onBind(el, isChange) {
  const path = el.dataset.bind;
  setPath(path, readValue(el));
  // side effects
  if (path === 'settings.autoClass' && !el.checked && !state.settings.className) state.settings.className = autoClassName();
  if (/\.type$/.test(path)) fixFieldAfterType(path);
  if (/^update\.ops#\w+\.(field\.name|column)$/.test(path) && isChange) autofillFromKnown(path);
  if (/^create\.fields#\w+\.name$/.test(path) && isChange) syncFkRename();
  if (isChange && 'rerender' in el.dataset) scheduleRender(); else refresh();
}

function fixFieldAfterType(path) {
  const base = path.replace(/\.type$/, '');
  const parts = base.split('.'); let obj = state;
  for (const p of parts) { const m = p.match(/^(\w+)#(\w+)$/); obj = m ? obj[m[1]].find(x => x.id === m[2]) : obj[p]; if (!obj) return; }
  const t = T(obj);
  if (!t.uns) obj.unsigned = false;
  if (!t.ai) obj.ai = false;
  if (!t.len) obj.length = '';
  else if (t.len === 'req' && !obj.length) obj.length = t.ph;
  else if (t.len === 'prec' && !/^\d+\s*,\s*\d+$/.test(obj.length)) obj.length = t.ph;
  else if (t.len === 'vals' && /^\d+$/.test(obj.length)) obj.length = '';
  if (t.nodef) obj.def = '';
}

let lastFieldNames = {};
function syncFkRename() {
  // keep FKs pointing to renamed fields
  const map = {}; state.create.fields.forEach(f => map[f.id] = f.name);
  state.create.fks.forEach(fk => {
    const prevId = Object.keys(lastFieldNames).find(id => lastFieldNames[id] === fk.column);
    if (prevId && map[prevId] && map[prevId] !== fk.column) fk.column = map[prevId];
  });
  lastFieldNames = map;
}

function autofillFromKnown(path) {
  const id = path.match(/ops#(\w+)/)[1];
  const op = state.update.ops.find(o => o.id === id); if (!op) return;
  const known = knownColumns();
  const name = op.kind === 'dropColumn' ? op.field.name : op.column;
  const src = known.find(f => f.name === name); if (!src) return;
  const copy = o => Object.assign(F(''), JSON.parse(JSON.stringify(o)), { id:uid() });
  if (op.kind === 'dropColumn') {
    op.field = copy(src);
    const idx = state.create.fields.indexOf(src); op.after = idx > 0 ? state.create.fields[idx-1].name : '';
  } else if (op.kind === 'modifyColumn') {
    op.from = copy(src); op.from.key = 'none';
    if (!op.to.name || op.to.name === '') { op.to = copy(src); op.to.key = 'none'; }
  }
}

function moveIn(arr, id, dir) {
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}

const ACTIONS = {
  mode: v => { state.mode = v; ui.tab = v === 'create' ? 'fields' : 'ops'; if (v === 'update' && !state.update.table) state.update.table = state.create.table; render(); },
  tab: v => { ui.tab = v; render(); },
  out: v => { ui.out = v; refresh(); },
  'add-field': () => { state.create.fields.push(F(`columna_${state.create.fields.length + 1}`, 'VARCHAR', { length:'255', nullable:true })); render(); focusLast('create.fields', 'name'); },
  'del-field': (v, el) => { const f = state.create.fields.find(x => x.id === el.dataset.id); state.create.fields = state.create.fields.filter(x => x.id !== el.dataset.id); if (f) state.create.fks = state.create.fks.filter(fk => fk.column !== f.name); delete state.seeder.gens[el.dataset.id]; render(); },
  'dup-field': (v, el) => { const i = state.create.fields.findIndex(x => x.id === el.dataset.id); if (i < 0) return; const c = Object.assign({}, state.create.fields[i], { id:uid(), name: state.create.fields[i].name + '_copia', key: state.create.fields[i].key === 'primary' ? 'none' : state.create.fields[i].key, ai:false }); state.create.fields.splice(i + 1, 0, c); render(); },
  'move-field': (v, el) => { moveIn(state.create.fields, el.dataset.id, +el.dataset.dir); render(); },
  quick: v => {
    const fs = state.create.fields, has = n => fs.some(f => f.name === n);
    if (v === 'id') { if (has('id')) return toast('Ja existeix una columna id', true); fs.unshift(idField()); }
    if (v === 'timestamps') { tsFields().forEach(f => { if (!has(f.name)) fs.push(f); }); }
    if (v === 'soft') { if (!has('deleted_at')) fs.push(F('deleted_at','DATETIME',{nullable:true})); }
    if (v === 'fk') {
      const f = F('user_id','INT',{unsigned:true, key:'index'}); let n = 1; while (has(f.name)) f.name = `user_id_${++n}`;
      const at = fs.findIndex(x => x.key === 'primary'); fs.splice(at >= 0 ? at + 1 : 0, 0, f);
      state.create.fks.push({ id:uid(), column:f.name, refTable:'users', refColumn:'id', onUpdate:'CASCADE', onDelete:'CASCADE' });
      toast('Columna i clau forana afegides (revisa-les a "Claus i índexs")');
    }
    render();
  },
  'add-fk': () => { const cand = state.create.fields.find(f => /_id$/.test(f.name) && !state.create.fks.some(k => k.column === f.name)); state.create.fks.push({ id:uid(), column: cand ? cand.name : '', refTable: cand ? cand.name.replace(/_id$/, '') + 's' : '', refColumn:'id', onUpdate:'CASCADE', onDelete:'CASCADE' }); render(); },
  'del-fk': (v, el) => { state.create.fks = state.create.fks.filter(x => x.id !== el.dataset.id); render(); },
  'add-index': () => { (state.create.indexes ||= []).push({ id:uid(), columns:'', unique:false, name:'' }); render(); },
  'del-index': (v, el) => { state.create.indexes = state.create.indexes.filter(x => x.id !== el.dataset.id); render(); },
  'add-op': v => { state.update.ops.push(newOp(v)); render(); const last = document.querySelectorAll('.op'); last[last.length-1]?.scrollIntoView({ behavior:'smooth', block:'center' }); },
  'del-op': (v, el) => { state.update.ops = state.update.ops.filter(x => x.id !== el.dataset.id); render(); },
  'move-op': (v, el) => { moveIn(state.update.ops, el.dataset.id, +el.dataset.dir); render(); },
  'seed-mode': v => { state.seeder.mode = v; if (v === 'static' && state.seeder.count > 500) state.seeder.count = 50; render(); },
  reroll: () => { state.seeder.jsSeed = Math.floor(Math.random() * 1e9); render(); },
  'new-ts': () => { state.settings.timestamp = ts(); refresh(); toast('Timestamp actualitzat'); },
  copy: () => copyText(current.code, 'Codi copiat al porta-retalls'),
  'copy-text': (v, el) => copyText(el.dataset.text, 'Ordre copiada'),
  download: () => { download(current.filename, current.code, ui.out === 'json' ? 'application/json' : 'text/x-php'); toast(`Descarregat ${current.filename}`); },
  'export-json': () => { download(`kpmigrator-${state.mode === 'create' ? state.create.table : state.update.table}.json`, JSON.stringify(state, null, 2), 'application/json'); toast('Esquema exportat'); },
  share: () => { const url = location.origin + location.pathname + '#s=' + b64enc(JSON.stringify(state)); copyText(url, 'Enllaç copiat: conté tot l\'esquema'); },
  reset: () => { if (!confirm('Vols reiniciar tot l\'esquema? Es perdran els canvis no exportats.')) return; state = defaultState(); ui.tab = 'fields'; render(); toast('Esquema reiniciat'); },
  theme: () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('kpmigrator:theme', root.dataset.theme); } catch {}
  },
};

function focusLast(listPath, key) {
  setTimeout(() => { const els = document.querySelectorAll(`[data-bind^="${listPath}#"][data-bind$=".${key}"]`); const el = els[els.length - 1]; if (el) { el.focus(); el.select(); el.scrollIntoView({ block:'center', behavior:'smooth' }); } }, 10);
}

function applyTemplate(v) {
  const [kind, key] = v.split(':');
  if (kind === 'c') {
    const t = TEMPLATES[key](); state.mode = 'create';
    state.create = Object.assign({ ifNotExists:false, ifExists:true, engine:'', comment:'' }, t);
    state.seeder.gens = {}; ui.tab = 'fields';
    toast(`Plantilla "${t.table}" carregada`);
  } else {
    const t = UPDATE_TEMPLATES[key](); state.mode = 'update'; state.update = t; ui.tab = 'ops';
    toast('Exemple de modificació carregat');
  }
  state.settings.autoClass = true; state.settings.timestamp = ts();
  lastFieldNames = {}; state.create.fields.forEach(f => lastFieldNames[f.id] = f.name);
  render();
}

async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(msg);
}
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type: type + ';charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href:url, download:name }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
let toastT;
function toast(msg, err = false) {
  const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2600);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action]; if (fn) { e.preventDefault(); fn(el.dataset.v, el); }
});
const editorEl = document.getElementById('editor');
editorEl.addEventListener('input', e => { const el = e.target; if (!el.dataset.bind || el.type === 'checkbox' || el.tagName === 'SELECT') return; onBind(el, false); });
editorEl.addEventListener('change', e => { const el = e.target; if (!el.dataset.bind) return; onBind(el, true); });
document.getElementById('tplSelect').addEventListener('change', e => { if (e.target.value) applyTemplate(e.target.value); e.target.value = ''; });
document.getElementById('importInput').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d && (d.create || d.update)) { state = normalize(d); }
      else if (d && Array.isArray(d.fields)) { // legacy format (CI4 Migration & Seeder Studio)
        state = defaultState();
        state.create.table = d.tableName || 'taula';
        state.create.fields = d.fields.map(f => F(f.name, (f.type || 'VARCHAR').toUpperCase(), { length: f.type === 'ENUM' ? splitList(f.constraint).join(', ') : (/^INT|BIGINT|SMALLINT|TINYINT|MEDIUMINT$/.test(f.type) ? '' : (f.constraint || '')), unsigned: !!f.unsigned, nullable: !!f.nullable, ai: !!f.autoIncrement, def: f.defaultValue || '', key: f.keyType || 'none' }));
        state.create.fks = (d.foreignKeys || []).map(k => ({ id:uid(), column:k.field, refTable:k.foreignTable, refColumn:k.foreignField || 'id', onUpdate:k.onUpdate || 'CASCADE', onDelete:k.onDelete || 'CASCADE' }));
        state.create.ifNotExists = !!d.ifNotExists; state.create.ifExists = d.ifExists !== false;
        if (d.migrationNamespace) state.settings.migrationNs = d.migrationNamespace;
        if (d.seederNamespace) state.settings.seederNs = d.seederNamespace;
        if (d.seederCount) state.seeder.count = d.seederCount;
      } else throw new Error('format');
      ui.tab = state.mode === 'create' ? 'fields' : 'ops';
      render(); toast('Esquema importat');
    } catch { toast('El fitxer JSON no és vàlid', true); }
    e.target.value = '';
  };
  r.readAsText(file);
});

/* =========================================================================
   INIT
   ========================================================================= */
try { const th = localStorage.getItem('kpmigrator:theme'); if (th) document.documentElement.dataset.theme = th; } catch {}
loadInitial();
state.create.fields.forEach(f => lastFieldNames[f.id] = f.name);
render();
</script>
</body>
